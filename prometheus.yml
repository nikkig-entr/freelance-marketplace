global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    project: 'freelance-marketplace'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-backend'

  # Frontend (if using nginx-prometheus-exporter)
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:5173']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-frontend'

  # PostgreSQL metrics (requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-postgres'

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-redis'

  # Node Exporter for host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'

  # Meilisearch metrics
  - job_name: 'meilisearch'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['meilisearch:7700']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-meilisearch'

  # MinIO metrics
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-minio'

  # Celery metrics (requires celery-exporter)
  - job_name: 'celery'
    static_configs:
      - targets: ['celery_worker:9091']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'freelance-celery-worker'